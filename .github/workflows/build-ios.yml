name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ipa:
    name: Build & Package Kairou.ipa
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            PROJECT_ARG="-workspace App.xcworkspace"
          else
            PROJECT_ARG="-project App.xcodeproj"
          fi
          
          echo "Building with $PROJECT_ARG..."
          xcodebuild archive \
            $PROJECT_ARG \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES || \
          xcodebuild build \
            $PROJECT_ARG \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          cd ios/App
          mkdir -p build/Payload
          
          if [ -d "build/App.xcarchive/Products/Applications" ]; then
            echo "Copying from archive..."
            cp -r build/App.xcarchive/Products/Applications/*.app build/Payload/
          elif [ -d "build/DerivedData/Build/Products/Release-iphoneos" ]; then
            echo "Copying from DerivedData..."
            cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app build/Payload/
          fi
          
          cd build
          zip -qr Kairou.ipa Payload
          mv Kairou.ipa ../../../Kairou.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kairou-iOS-IPA
          path: Kairou.ipa
          retention-days: 30
