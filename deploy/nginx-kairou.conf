# Configuração Nginx de Alta Performance para Kairou Streaming
# Suporta IP direto (217.217.235.211) e domínios personalizados

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kairou.space www.kairou.space cinetuga.vip www.cinetuga.vip 217.217.235.211 _;

    # Raiz onde estão os arquivos compilados do Vite
    root /var/www/kairou/dist;
    index index.html;

    # Se a pasta /var/www/kairou não existir e estiver em /var/www/cinetuga, fallback suave
    # (controlado pelo deploy.sh com symlink se necessário)

    # Otimização de buffers para streaming e conexões simultâneas
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # Compressão Gzip para carregamento instantâneo
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy para API Node.js (Extratores e Turbo Proxy de Streaming)
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts longos para streaming HLS/MP4
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Cache estático de alta velocidade para JS, CSS, Imagens, Fontes
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Roteamento SPA (Single Page Application - React Router / Tabs)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
