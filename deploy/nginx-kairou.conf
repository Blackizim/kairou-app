# ==============================================================================
# Configuração Nginx de Alta Performance com SSL para Kairou Streaming
# Domínios: kairou.space, www.kairou.space e IP direto 217.217.235.211
# ==============================================================================

# 1. Redirecionamento HTTP -> HTTPS para domínios oficiais
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name kairou.space www.kairou.space;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal HTTPS (SSL com Certificado Let's Encrypt Kairou)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kairou.space www.kairou.space;

    # Certificados SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/kairou.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kairou.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/kairou/dist;
    index index.html;

    client_max_body_size 100M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Proxy para API Node.js Kairou (Extratores e Turbo Proxy HLS)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Proxy para rotas de addons /api-*
    location ~ ^/api- {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
    }

    # Cache estático de alta velocidade
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Roteamento SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}

